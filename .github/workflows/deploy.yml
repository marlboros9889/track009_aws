name: Deploy Fullstack App

on:
  push:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Build Spring Boot App
        working-directory: back
        run: |
          # Gradle 실행 권한을 부여한 뒤 테스트를 제외하고 JAR를 만듭니다.
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: Find executable JAR file
        run: |
          # plain.jar는 실행용 JAR가 아니므로 제외합니다.
          JAR_FILE=$(find back/build/libs -maxdepth 1 -type f -name "*SNAPSHOT.jar" ! -name "*-plain.jar" -print -quit)

          if [ -z "$JAR_FILE" ]; then
            echo "실행용 JAR 파일을 찾지 못했습니다."
            ls -al back/build/libs
            exit 1
          fi

          echo "JAR_FILE=$JAR_FILE" >> "$GITHUB_ENV"
          echo "JAR_NAME=$(basename "$JAR_FILE")" >> "$GITHUB_ENV"

      - name: Create Backend .env from Secrets
        run: |
          echo "DB_USERNAME=${{ secrets.DB_USERNAME }}" > back/.env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> back/.env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> back/.env
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> back/.env
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> back/.env
          echo "KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}" >> back/.env
          echo "NAVER_CLIENT_ID=${{ secrets.NAVER_CLIENT_ID }}" >> back/.env
          echo "NAVER_CLIENT_SECRET=${{ secrets.NAVER_CLIENT_SECRET }}" >> back/.env

      - name: Ensure backend directory exists on EC2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: mkdir -p /home/${{ secrets.EC2_USER }}/app/back

      - name: Copy Backend JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "${{ env.JAR_FILE }}"
          target: "/home/${{ secrets.EC2_USER }}/app/back"

      - name: Copy Backend .env to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "back/.env"
          target: "/home/${{ secrets.EC2_USER }}/app/back"

      - name: Wait for Oracle and Redis
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            for i in {1..30}; do
              if nc -z localhost 1521 && nc -z localhost 6379; then
                echo "Oracle DB와 Redis가 준비되었습니다."
                exit 0
              fi

              echo "DB 또는 Redis 준비 대기 중: $i/30"
              sleep 10
            done

            echo "Oracle DB 또는 Redis가 준비되지 않았습니다."
            exit 1

      - name: Run Backend on EC2 with pm2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/${{ secrets.EC2_USER }}/app/back

            # .env 값을 현재 Java 프로세스의 환경변수로 등록합니다.
            set -a
            . ./.env
            set +a

            pm2 delete backend || true
            pm2 start java --name backend -- -jar "${{ env.JAR_NAME }}"
            pm2 save

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Create Frontend .env.production
        run: |
          echo "NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL }}" > front/.env.production

      - name: Build Frontend
        working-directory: front
        run: |
          npm ci
          npm run build -- --no-lint

      - name: Archive frontend build
        run: |
          cd front
          # 실행에 필요한 Next 결과물과 의존성 목록을 압축합니다.
          tar -czf ../frontend-build.tar.gz .next public package.json package-lock.json .env.production

      - name: Ensure frontend directory exists on EC2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: mkdir -p /home/${{ secrets.EC2_USER }}/app/front

      - name: Copy frontend archive to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "frontend-build.tar.gz"
          target: "/home/${{ secrets.EC2_USER }}/app/front"

      - name: Extract frontend archive on EC2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/${{ secrets.EC2_USER }}/app/front
            rm -rf .next public
            tar -xzf frontend-build.tar.gz
            rm -f frontend-build.tar.gz

      - name: Run Frontend on EC2 with pm2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/${{ secrets.EC2_USER }}/app/front
            npm ci --omit=dev
            pm2 delete frontend || true
            pm2 start npm --name frontend -- run start
            pm2 save